name: Scrap ISO3166 and M49 from UN

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: currency-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  download-iso3166-m49:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
      - name: Install Python and locked dependencies
        run: |
          uv python install
          uv sync --locked
      - name: Get current date
        run: echo "DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
      - name: Scrape ISO3166 and M49 data from UN
        run: uv run --locked python ./scrapper/iso3166_from_m49_scrapper.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: jsons-artefact
          path: |
            ./countries_iso3166_m49.json
      - name: commit generated jsons
        run: |
          git config user.name "GitHub Actions"
          git config user.email "no-reply@github.com"
          git add ./countries_iso3166_m49.json
          if ! git diff --cached --quiet; then
            git commit -m "ISO3166 (2/3 alpha) and UN M49 - $DATE"
            git push origin main
          fi
