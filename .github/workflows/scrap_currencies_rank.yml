name: Scrap Most Traded Currencies from Wikipedia

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: currency-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  download-currencies-rank:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
      - name: Install Python and locked dependencies
        run: |
          uv python install
          uv sync --locked
      - name: Get current date
        run: echo "DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
      - name: Scrap currencies ranking from Wikipedia
        run: uv run --locked python ./scrapper/top_currency_wiki_scrapper.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: jsons-artefact
          path: |
            ./top_currencies.json
      - name: commit generated jsons
        run: |
          git config user.name "GitHub Actions"
          git config user.email "no-reply@github.com"
          git add ./top_currencies.json
          if ! git diff --cached --quiet; then
            git commit -m "Top Currencies Ranked $DATE"
            git push origin main
          fi
